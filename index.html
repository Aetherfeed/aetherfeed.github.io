<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var stored = localStorage.getItem('color-scheme');
        if (stored !== 'light' && stored !== 'dark') {
          var legacy = localStorage.getItem('theme');
          if (legacy === 'light' || legacy === 'dark') {
            var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (legacy !== sys) {
              localStorage.setItem('color-scheme', legacy);
              stored = legacy;
            }
            localStorage.removeItem('theme');
          }
        }
        if (meta) meta.content = stored === 'light' || stored === 'dark' ? stored : 'light dark';
        var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {}
    })();
  </script>
  <meta name="darkreader-lock" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    referrerpolicy="no-referrer"
  />
  <title>Aetherfeed — FFXIV Dalamud Plugin Feed</title>
  <meta
    name="description"
    content="A searchable feed of FFXIV plugins. Find, filter, and explore the latest plugins for your game."
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
